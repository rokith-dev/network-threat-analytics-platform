version: '3.9'

services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: network_threat_db

    ports:
      - "3307:3306"

  streamlit-app:
    build: .
    container_name: streamlit-app

    ports:
      - "8501:8501"

    depends_on:
      - mysql-db